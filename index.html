<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1218">
  <title>Personal Space</title>
  <script>try{var d=document.documentElement;d.lang=localStorage.getItem('ps-lang')||'ar';d.dir=d.lang==='ar'?'rtl':'ltr';d.dataset.theme=localStorage.getItem('ps-theme')||'dark'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <strong class="brand">Personal Space</strong>
    <span id="saveState" class="save-state"></span>
    <div class="seg" id="langSeg">
      <button data-act="lang" data-v="ar">العربية</button>
      <button data-act="lang" data-v="en">English</button>
    </div>
    <div class="seg" id="themeSeg">
      <button data-act="theme" data-v="dark"></button>
      <button data-act="theme" data-v="light"></button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
  <div id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
